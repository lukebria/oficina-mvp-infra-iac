# Kong em modo DB-less: sem banco próprio (Postgres/Cassandra) para o Kong,
# combina com a restrição de custo do projeto (nenhum recurso billável novo).
env:
  database: "off"

# Ingress Controller: as rotas vêm de manifests `Ingress` padrão do Kubernetes
# (declarados no repositório da aplicação), em vez de config declarativa manual.
ingressController:
  enabled: true
  # CRDs ficam SÓ com o mecanismo nativo do Helm 3 (pasta crds/ do chart). Com installCRDs: true o chart
  # também os renderiza como template, e a instalação aborta com "CustomResourceDefinition ... exists and
  # cannot be imported into the current release" (os da pasta crds/ não levam labels de ownership do Helm).
  installCRDs: false

admin:
  enabled: false

proxy:
  type: LoadBalancer
